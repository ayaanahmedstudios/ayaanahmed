
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F6F2">
  <title>Ayaan Ahmed</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Pixel:ELSH@0..100&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #F7F6F2;
    }

    body {
      background: #F7F6F2;
      color: #171717;
      overflow-x: hidden;
    }

    .scroll-stage {
      position: relative;
      height: 210svh;
    }

    .hero {
      position: sticky;
      top: 0;
      height: 100svh;
      width: 100%;
      display: grid;
      place-items: center;
    }

    .composition {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      cursor: crosshair;
      -webkit-tap-highlight-color: transparent;
    }

    .name {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Geist', sans-serif;
      font-size: clamp(3rem, 8.5vw, 8rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 1.2;
      font-kerning: normal;
      font-variant-ligatures: none;
      overflow: visible;
    }

    .char {
      display: inline-block;
      vertical-align: baseline;
      will-change: transform, opacity;
    }

    .subtitle {
      margin-top: 26px;
      color: #77746F;
      font-family: 'Geist Pixel', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      opacity: 0;
    }

    @media (max-width: 600px) {
      .name {
        font-size: clamp(2.7rem, 10.5vw, 4.5rem);
      }

      .subtitle {
        margin-top: 22px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-stage {
        height: 100svh;
      }

      .char {
        opacity: 1 !important;
        transform: none !important;
      }

      .subtitle {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <section class="scroll-stage">
    <main class="hero">
      <a
        class="composition"
        href="https://www.instagram.com/bluetigerincstudios/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Ayaan Ahmed on Instagram"
      >
        <h1 class="name" aria-label="Ayaan Ahmed">Ayaan Ahmed</h1>
        <p class="subtitle">THIS PAGE IS BEING DESIGNED</p>
      </a>
    </main>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger, SplitText);

    const name = document.querySelector('.name');
    const subtitle = document.querySelector('.subtitle');
    const stage = document.querySelector('.scroll-stage');

    const reducedMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    const canHover = window.matchMedia(
      '(hover: hover) and (pointer: fine)'
    ).matches;

    let chars = [];
    let motion = [];
    let renderers = [];
    let hoverSetters = [];

    let ambientAnimation;
    let scrollAnimation;

    const ambient = { phase: 0 };
    const scroll = { progress: 0 };

    function render() {
      motion.forEach((item, index) => {
        const total =
          item.intro +
          item.ambient +
          item.scroll +
          item.hover;

        renderers[index](total);
      });
    }

    function renderAmbient() {
      motion.forEach((item, index) => {
        item.ambient = Math.sin(
          ambient.phase - index * 0.65
        ) * 2;
      });

      render();
    }

    function renderScroll() {
      const progress = scroll.progress;
      const amplitude = Math.sin(progress * Math.PI) * 6;
      const phase = progress * Math.PI * 3;

      motion.forEach((item, index) => {
        const position = index / Math.max(chars.length - 1, 1);

        item.scroll = Math.sin(
          position * Math.PI * 4 - phase
        ) * amplitude;
      });

      render();
    }

    function renderHover(pointerX) {
      chars.forEach((char, index) => {
        const rect = char.getBoundingClientRect();
        const center = rect.left + rect.width / 2;
        const distance = center - pointerX;

        const influence = Math.exp(
          -Math.abs(distance) / 65
        );

        const wave = Math.cos(distance / 19);

        hoverSetters[index](
          -wave * influence * 12
        );
      });
    }

    function initialiseHover() {
      hoverSetters = motion.map(item =>
        gsap.quickTo(item, 'hover', {
          duration: 0.35,
          ease: 'power3.out',
          onUpdate: render
        })
      );

      name.addEventListener('pointerenter', event => {
        renderHover(event.clientX);
      });

      name.addEventListener('pointermove', event => {
        renderHover(event.clientX);
      });

      name.addEventListener('pointerleave', () => {
        hoverSetters.forEach(setter => setter(0));
      });
    }

    function initialiseAmbient() {
      ambientAnimation = gsap.to(ambient, {
        phase: Math.PI * 2,
        duration: 9,
        ease: 'none',
        repeat: -1,
        onUpdate: renderAmbient
      });
    }

    function initialiseScroll() {
      scrollAnimation = gsap.to(scroll, {
        progress: 1,
        ease: 'none',
        scrollTrigger: {
          trigger: stage,
          start: 'top top',
          end: 'bottom bottom',
          scrub: 0.8
        },
        onUpdate: renderScroll
      });
    }

    async function initialise() {
      await document.fonts.ready;

      if (reducedMotion) {
        gsap.set(subtitle, { opacity: 1 });
        return;
      }

      const split = SplitText.create(name, {
        type: 'chars',
        charsClass: 'char',
        tag: 'span'
      });

      chars = split.chars.filter(char =>
        char.textContent.trim() !== ''
      );

      motion = chars.map(() => ({
        intro: 0,
        ambient: 0,
        scroll: 0,
        hover: 0
      }));

      renderers = chars.map(char =>
        gsap.quickSetter(char, 'y', 'px')
      );

      gsap.set(chars, {
        autoAlpha: 0
      });

      gsap.set(subtitle, {
        autoAlpha: 0,
        y: 7
      });

      const entrance = gsap.timeline({
        onComplete: () => {
          initialiseAmbient();
        }
      });

      entrance.to(chars, {
        autoAlpha: 1,
        duration: 0.5,
        stagger: {
          each: 0.045,
          from: 'center'
        },
        ease: 'power2.out'
      }, 0);

      entrance.fromTo(
        motion,
        {
          intro: index => index % 2 === 0 ? 18 : -18
        },
        {
          intro: 0,
          duration: 1.15,
          stagger: {
            each: 0.045,
            from: 'center'
          },
          ease: 'power4.out',
          onUpdate: render
        },
        0
      );

      entrance.to(subtitle, {
        autoAlpha: 1,
        y: 0,
        duration: 0.8,
        ease: 'power3.out'
      }, 0.7);

      initialiseScroll();

      if (canHover) {
        initialiseHover();
      }
    }

    initialise();
  </script>
</body>
</html>
