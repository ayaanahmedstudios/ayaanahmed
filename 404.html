<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 / Ayaan Ahmed</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Syne:wght@800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">

<style>
    /* =========================================
       STANDALONE 404 STYLES
       ========================================= */
    :root {
        --bg: #121212;
        --fg: #ffffff;
        --accent: #84bdb8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: 'Bricolage Grotesque', sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        -webkit-font-smoothing: antialiased;
    }

    /* Minimal Background Grid */
    .grid-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-size: 30px 30px;
        background-image: 
            linear-gradient(90deg, transparent 14px, rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 16px, transparent 16px),
            linear-gradient(0deg, transparent 14px, rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 16px, transparent 16px);
        mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    }

    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 10;
    }

    /* Kinetic 404 Interaction */
    .kinetic-404 {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        cursor: pointer;
    }

    .digit {
        font-family: 'Syne', sans-serif;
        font-size: clamp(8rem, 25vw, 15rem);
        font-weight: 800;
        line-height: 0.8;
        color: var(--fg);
        transition: transform 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.27), color 0.3s;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Kinetic Hover States */
    .kinetic-404:hover .digit:nth-child(1) { transform: translateY(-20px) rotate(-15deg); color: var(--accent); }
    .kinetic-404:hover .digit:nth-child(2) { transform: translateY(10px) scale(0.8); }
    .kinetic-404:hover .digit:nth-child(3) { transform: translateY(-10px) rotate(10deg) skewX(10deg); color: var(--accent); }

    .error-msg {
        font-size: clamp(1.2rem, 4vw, 2rem);
        font-weight: 500;
        letter-spacing: -0.5px;
        color: #888;
        margin-bottom: 40px;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1s forwards 0.5s;
    }

    .cta-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 38px;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 550;
        color: rgba(255,255,255,0.9);
        background: rgba(255,255,255,0.02);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        text-decoration: none;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1s forwards 0.7s;
        position: relative;
        overflow: hidden;
    }

    .cta-button::after {
        content: ''; position: absolute; inset: 0; border-radius: 50px; padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 50%, rgba(255,255,255,0.05));
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude; -webkit-mask-composite: destination-out; pointer-events: none;
    }

    .cta-button:hover {
        background: rgba(132, 189, 184, 0.1);
        border-color: rgba(132, 189, 184, 0.4);
        transform: translateY(-2px);
        color: var(--accent);
    }

    @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile Adjustments */
    @media (max-width: 768px) {
        .kinetic-404 { flex-direction: column; gap: 0; line-height: 0.7; }
        .kinetic-404:hover .digit { transform: none; color: var(--accent); } /* Disable complex hover on mobile */
    }
</style>
</head>
<body>

    <div class="grid-bg"></div>

    <main class="error-container">
        
        <div class="kinetic-404" id="glitch-block">
            <span class="digit">4</span>
            <span class="digit">0</span>
            <span class="digit">4</span>
        </div>

        <p class="error-msg">Lost in the grid.</p>
        
        <a href="index.html" class="cta-button">Go Home</a>

    </main>

    <script>
        // Standalone Kinetic Script for 404 Interactivity
        document.addEventListener('DOMContentLoaded', () => {
            const block = document.getElementById('glitch-block');
            const digits = document.querySelectorAll('.digit');
            
            // Randomize position slightly on click
            block.addEventListener('click', () => {
                digits.forEach(digit => {
                    const x = (Math.random() - 0.5) * 40;
                    const y = (Math.random() - 0.5) * 40;
                    const rot = (Math.random() - 0.5) * 30;
                    
                    digit.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                    digit.style.color = 'var(--accent)';
                    
                    // Snap back
                    setTimeout(() => {
                        digit.style.transform = '';
                        digit.style.color = '';
                    }, 300);
                });
            });
        });
    </script>
</body>
</html>
