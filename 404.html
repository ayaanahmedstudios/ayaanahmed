<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 / Ayaan Ahmed</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Syne:wght@800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow">

<style>
    :root {
        --bg-color: #121212;
        --text-color: #ffffff;
        --accent-color: #84bdb8;
        --muted-text: #ccc;
        --border-color: rgba(255, 255, 255, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { width: 100%; scroll-behavior: smooth; }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Bricolage Grotesque', sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; width: 100%; position: relative; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
    img { -webkit-user-select: none; user-select: none; pointer-events: none; }

    .header { height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; background: transparent; position: relative; z-index: 200; flex-shrink: 0; transition: background 0.3s ease; }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; cursor: pointer; color: #fff; padding: 0 5px; background: linear-gradient(to right, transparent 50%, var(--accent-color) 50%); background-size: 200% 100%; transition: background-position 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), color 0.4s ease; display: flex; overflow: hidden; }
    .logo:hover { background-position: -100% 0; color: #121212; }
    .logo span { display: inline-block; transform: translateY(100%); animation: slotSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; transition: color 0.4s ease; }
    .logo-mobile { display: none; }

    .desktop-nav { display: flex; gap: 30px; }
    .desktop-nav a { font-size: 1rem; color: #ffffff; font-weight: 550; opacity: 0; transition: font-variation-settings 0.45s cubic-bezier(0.23, 1, 0.32, 1), color 0.3s ease; font-variation-settings: 'wght' 550; animation: simpleFade 0.5s ease forwards 0.5s; position: relative; flex-shrink: 0; }
    .desktop-nav a:hover { color: var(--accent-color); font-variation-settings: 'wght' 350; }

    @keyframes slotSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes simpleFade { to { opacity: 1; } }

    .menu-icon { display: none; }
    .menu-overlay { display: none; }

    .footer { height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; font-size: 0.9rem; color: #888; background: transparent; z-index: 10; margin-top: auto; flex-shrink: 0; }
    .copyright { color: #ccc; font-size: 0.9rem; }
    .copyright strong { font-weight: 500; }
    .footer-right { display: flex; align-items: center; gap: 15px; }

    .contact-btn { background: none; border: none; padding: 0; font-family: inherit; font-size: 0.9rem; font-weight: 550; font-variation-settings: 'wght' 550; color: rgba(255,255,255,0.6); cursor: pointer; outline: none; display: inline-flex; align-items: center; justify-content: center; transition: color 0.3s ease, font-variation-settings 0.3s ease; }
    .contact-btn:hover { color: var(--accent-color); font-variation-settings: 'wght' 350; }
    .contact-state-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 70px; height: 20px; }
    .contact-label, .contact-success { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .contact-success { color: var(--accent-color); font-variation-settings: 'wght' 350; position: absolute; inset: 0; justify-content: center; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .contact-label { position: absolute; inset: 0; justify-content: center; transition: opacity 0.3s; }
    .contact-btn.is-active .contact-label { opacity: 0; }
    .contact-btn.is-active .contact-success { opacity: 1; }
    .contact-btn.fidget-pop { animation: fidgetPop 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.27); }
    @keyframes fidgetPop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    .social-icons { display: flex; gap: 15px; align-items: center; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 15px; margin-left: 5px; }
    .icon-link { width: 20px; height: 20px; opacity: 0.6; transition: all 0.3s ease; display: block; color: #ffffff !important; }
    .icon-link svg { width: 100%; height: 100%; fill: currentColor; }
    .icon-link img { width: 100%; height: 100%; object-fit: contain; }
    .icon-link:hover { opacity: 1; color: var(--accent-color) !important; }

    .grid-bg { position: fixed; inset: 0; z-index: -1; background-size: 30px 30px; background-image: linear-gradient(90deg, transparent 14px, rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 16px, transparent 16px), linear-gradient(0deg, transparent 14px, rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 16px, transparent 16px); mask-image: radial-gradient(circle at center, black 0%, transparent 70%); -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%); }
    .error-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; padding: 0 20px; min-height: 70vh; width: 100%; max-width: 100vw; overflow-x: hidden; }
    .kinetic-404 { display: flex; flex-direction: row; gap: 15px; margin-bottom: 20px; cursor: pointer; justify-content: center; align-items: center; width: 100%; }
    .digit { font-family: 'Syne', sans-serif; font-size: clamp(4.5rem, 15vw, 12rem); font-weight: 800; line-height: 1; color: var(--text-color); transition: transform 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.27), color 0.3s; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    @media (hover: hover) and (pointer: fine) {
        .kinetic-404:hover .digit:nth-child(1) { transform: translateY(-20px) rotate(-15deg); color: var(--accent-color); }
        .kinetic-404:hover .digit:nth-child(2) { transform: translateY(10px) scale(0.8); }
        .kinetic-404:hover .digit:nth-child(3) { transform: translateY(-10px) rotate(10deg) skewX(10deg); color: var(--accent-color); }
    }

    .error-msg { font-size: clamp(1rem, 4vw, 1.5rem); font-weight: 500; letter-spacing: -0.5px; color: #888; margin-bottom: 40px; opacity: 0; transform: translateY(20px); animation: fadeUp 1s forwards 0.5s; max-width: 500px; padding: 0 10px; }
    
    .cta-button { display: inline-flex; align-items: center; justify-content: center; padding: 14px 38px; border-radius: 50px; font-size: 1rem; font-weight: 550; color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.02); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); text-decoration: none; opacity: 0; transform: translateY(20px); animation: fadeUp 1s forwards 0.7s; position: relative; overflow: hidden; }
    .cta-button::after { content: ''; position: absolute; inset: 0; border-radius: 50px; padding: 1px; background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 50%, rgba(255,255,255,0.05)); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; -webkit-mask-composite: destination-out; pointer-events: none; }
    .cta-button:hover { background: rgba(132, 189, 184, 0.1); border-color: rgba(132, 189, 184, 0.4); transform: translateY(-2px); color: var(--accent-color); }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
        .header { position: sticky; top: 0; background: rgba(18, 18, 18, 0.98); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 20px; z-index: 200; height: 90px; }
        .logo { display: none; }
        .logo-mobile { display: block; }
        .logo-mobile img { width: 46px; height: 46px; }
        .desktop-nav { display: none; }
        
        .menu-icon { display: block; cursor: pointer; width: 22px; height: 14px; position: relative; }
        .menu-icon span { display: block; position: absolute; height: 2.5px; width: 100%; background: #fff; border-radius: 0; transition: 0.3s ease; }
        .menu-icon span:nth-child(1) { top: 0px; }
        .menu-icon span:nth-child(2) { top: 6px; }
        .menu-icon span:nth-child(3) { top: 12px; }
        .menu-icon.open span:nth-child(1) { top: 6px; transform: rotate(45deg); }
        .menu-icon.open span:nth-child(2) { opacity: 0; }
        .menu-icon.open span:nth-child(3) { top: 6px; transform: rotate(-45deg); }

        .menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(18, 18, 18, 0.98); flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 40px; z-index: 150; }
        .menu-overlay::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 24px 24px; opacity: 0.6; pointer-events: none; z-index: -1; }
        .menu-overlay.active { display: flex; }
        .menu-overlay a { font-size: 2.2rem; margin: 15px 0; font-weight: 800; color: #fff; opacity: 0; transform: translateX(-20px); transition: all 0.4s ease; text-align: left; }
        .menu-overlay a:active { color: var(--accent-color); transform: scale(0.95); transition: 0.1s; }
        .menu-overlay.active a { opacity: 1; transform: translateX(0); }

        .footer { flex-direction: column-reverse; height: auto; padding: 60px 20px; gap: 20px; align-items: center; text-align: center; margin-top: 0; }
        .footer-right { flex-direction: row; width: auto; gap: 10px; justify-content: center; align-items: center; }
        .social-icons { border-left: none; padding-left: 0; margin-left: 0; gap: 15px; }

        .error-container { min-height: 60vh; }
        .kinetic-404 { gap: 8px; margin-bottom: 15px; }
        .error-msg { margin-bottom: 35px; }
    }
</style>
</head>
<body>

<header class="header">
<a href="index.html" class="logo">Ayaan Ahmed.</a>
<a href="index.html" class="logo-mobile"><img src="assets/logo.svg" alt="Ayaan Ahmed Studios"></a>
<nav class="desktop-nav">
<a href="portfolio/graphic-design.html">Graphic Design</a>
<a href="portfolio/photography.html">Photography</a>
<a href="portfolio/videography.html">Videography</a>
</nav>
<div class="menu-icon" onclick="toggleMenu()">
    <span></span><span></span><span></span>
</div>
</header>

<div class="menu-overlay" id="mobile-menu">
<a href="portfolio/graphic-design.html">Graphic Design</a>
<a href="portfolio/photography.html">Photography</a>
<a href="portfolio/videography.html">Videography</a>
<div style="width: 40px; height: 1px; background: var(--accent-color); margin: 20px 0; opacity: 0.5;"></div>
<a href="about.html" style="font-weight: 400; font-size: 1.5rem; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase;">About Me</a>
</div>

<div class="grid-bg"></div>

<main class="error-container">
    <div class="kinetic-404" id="glitch-block">
        <span class="digit">4</span>
        <span class="digit">0</span>
        <span class="digit">4</span>
    </div>
    <p class="error-msg">This section is still in development.</p>
    <a href="index.html" class="cta-button">Return to Home</a>
</main>

<footer class="footer">
<div class="copyright">© <span id="copyright-year">2026</span> <strong>Ayaan Ahmed Studios</strong></div>
<div class="footer-right">
<button class="contact-btn" id="contact-btn">
    <div class="contact-state-wrapper">
        <span class="contact-label">Contact</span>
        <span class="contact-success" style="display:none;">
            <svg width="12" height="10" viewBox="0 0 13 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 5L4.5 8.5L11.5 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Email Copied
        </span>
    </div>
</button>
<div class="social-icons">
<a href="https://instagram.com/bluetigerincstudios" target="_blank" class="icon-link"><img src="assets/instagram-icon.svg" alt="Instagram"></a>
<a href="https://www.linkedin.com/in/ayaanahmedofficial/" target="_blank" class="icon-link">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
<path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/>
</svg>
</a>
</div>
</div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const logo = document.querySelector('.logo');
        if (logo && !logo.classList.contains('animated')) {
            const text = logo.innerText;
            logo.innerHTML = '';
            logo.classList.add('animated');
            text.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.innerText = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = `${index * 0.05}s`;
                logo.appendChild(span);
            });
        }

        const navLinks = document.querySelectorAll('.desktop-nav a');
        navLinks.forEach((link, index) => {
            setTimeout(() => { link.classList.add('nav-enter'); }, index * 150 + 300);
        });

        const yearEl = document.getElementById('copyright-year');
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        const contactBtn = document.getElementById('contact-btn');
        const email = 'ayaanahmedstudios@gmail.com';
        let copyTimeout = null;

        if(contactBtn) {
            contactBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(email);
                contactBtn.classList.remove('fidget-pop');
                void contactBtn.offsetWidth; 
                contactBtn.classList.add('fidget-pop');
                
                const label = contactBtn.querySelector('.contact-label');
                const success = contactBtn.querySelector('.contact-success');
                
                label.style.opacity = '0';
                success.style.opacity = '1';
                success.style.display = 'flex';

                if (copyTimeout) clearTimeout(copyTimeout);
                copyTimeout = setTimeout(() => {
                    label.style.opacity = '1';
                    success.style.opacity = '0';
                    setTimeout(() => success.style.display = 'none', 300);
                }, 2500);
            });
        }

        const block = document.getElementById('glitch-block');
        const digits = document.querySelectorAll('.digit');
        if(block) {
            block.addEventListener('click', () => {
                digits.forEach(digit => {
                    const x = (Math.random() - 0.5) * 40;
                    const y = (Math.random() - 0.5) * 40;
                    const rot = (Math.random() - 0.5) * 30;
                    digit.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                    digit.style.color = 'var(--accent-color)';
                    setTimeout(() => {
                        digit.style.transform = '';
                        digit.style.color = '';
                    }, 300);
                });
            });
        }
    });

    function toggleMenu() {
        const menuOverlay = document.getElementById('mobile-menu');
        const menuIcon = document.querySelector('.menu-icon');
        const isVisible = menuOverlay.classList.contains('active');

        if (isVisible) {
            menuOverlay.classList.remove('active'); 
            menuIcon.classList.remove('open');
            setTimeout(() => { menuOverlay.style.display = 'none'; }, 400); 
            document.body.style.overflow = '';
        } else {
            menuOverlay.style.display = 'flex';
            menuIcon.classList.add('open');
            requestAnimationFrame(() => { menuOverlay.classList.add('active'); });
            document.body.style.overflow = 'hidden';
        }
    }
</script>
</body>
</html>
