<style>
    .error-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 10;
        position: relative;
    }

    .error-code {
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 800;
        line-height: 0.85;
        color: var(--accent-color);
        margin-bottom: 10px;
        letter-spacing: -5px;
    }

    .error-title {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -1px;
        margin-bottom: 20px;
        color: #fff;
    }

    .error-desc {
        font-size: 1.1rem;
        color: var(--muted-text);
        max-width: 400px;
        line-height: 1.6;
        margin-bottom: 40px;
    }

    .error-line {
        width: 60px;
        height: 2px;
        background: var(--accent-color);
        margin: 0 auto 30px auto;
        opacity: 0;
        animation: simpleFade 1s forwards 0.5s;
    }

    .err-glitch {
        display: inline-block;
        animation: errGlitchAnim 4s infinite step-end;
    }

    @keyframes errGlitchAnim {
        0%, 35% { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; transform: scale(1); letter-spacing: -5px; opacity: 1; }
        37% { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; transform: scale(1.05) skewX(-10deg); letter-spacing: 5px; opacity: 0.8; color: #fff; }
        39% { font-family: 'Courier New', monospace; font-weight: 800; transform: scale(0.95); letter-spacing: -10px; opacity: 0.5; }
        41%, 80% { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; transform: scale(1); letter-spacing: -5px; opacity: 1; color: var(--accent-color); }
        82% { font-variation-settings: 'wght' 200; transform: translateX(-10px); opacity: 0.3; }
        84% { font-variation-settings: 'wght' 900; transform: translateX(10px); opacity: 1; }
        86%, 100% { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; transform: scale(1); opacity: 1; }
    }
</style>
</head>
