<style>
    .grid-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-size: 30px 30px;
        background-image: 
            linear-gradient(90deg, transparent 14px, rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 16px, transparent 16px),
            linear-gradient(0deg, transparent 14px, rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 16px, transparent 16px);
        mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    }

    .error-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: 10;
        padding: 0 20px;
        min-height: 70vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
    }

    .kinetic-404 {
        display: flex;
        flex-direction: row;
        gap: 15px;
        margin-bottom: 20px;
        cursor: pointer;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .digit {
        font-family: 'Syne', sans-serif;
        font-size: clamp(4.5rem, 15vw, 12rem);
        font-weight: 800;
        line-height: 1;
        color: var(--text-color);
        transition: transform 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.27), color 0.3s;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @media (hover: hover) and (pointer: fine) {
        .kinetic-404:hover .digit:nth-child(1) { transform: translateY(-20px) rotate(-15deg); color: var(--accent-color); }
        .kinetic-404:hover .digit:nth-child(2) { transform: translateY(10px) scale(0.8); }
        .kinetic-404:hover .digit:nth-child(3) { transform: translateY(-10px) rotate(10deg) skewX(10deg); color: var(--accent-color); }
    }

    .error-msg {
        font-size: clamp(1rem, 4vw, 1.5rem);
        font-weight: 500;
        letter-spacing: -0.5px;
        color: #888;
        margin-bottom: 40px;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1s forwards 0.5s;
        max-width: 500px;
        padding: 0 10px;
    }

    .cta-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 38px;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: 550;
        color: rgba(255,255,255,0.9);
        background: rgba(255,255,255,0.02);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        text-decoration: none;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 1s forwards 0.7s;
        position: relative;
        overflow: hidden;
    }

    .cta-button::after {
        content: ''; position: absolute; inset: 0; border-radius: 50px; padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 50%, rgba(255,255,255,0.05));
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude; -webkit-mask-composite: destination-out; pointer-events: none;
    }

    .cta-button:hover {
        background: rgba(132, 189, 184, 0.1);
        border-color: rgba(132, 189, 184, 0.4);
        transform: translateY(-2px);
        color: var(--accent-color);
    }

    @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
        .error-container {
            min-height: 60vh;
        }
        .kinetic-404 { 
            gap: 8px; 
            margin-bottom: 15px; 
        }
        .error-msg {
            margin-bottom: 35px;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const block = document.getElementById('glitch-block');
        const digits = document.querySelectorAll('.digit');
        
        block.addEventListener('click', () => {
            digits.forEach(digit => {
                const x = (Math.random() - 0.5) * 40;
                const y = (Math.random() - 0.5) * 40;
                const rot = (Math.random() - 0.5) * 30;
                
                digit.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
                digit.style.color = 'var(--accent-color)';
                
                setTimeout(() => {
                    digit.style.transform = '';
                    digit.style.color = '';
                }, 300);
            });
        });
    });
</script>
